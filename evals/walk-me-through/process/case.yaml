schema_version: "1.1"
name: walk-me-through-process
tags: [walk-me-through]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "I'm joining the on-call rotation. Walk me through how we handle a database failover and why it's done that way."
  max_turns: 15
  allowed_tools: [Skill, Read, Glob, Grep]
graders:
  - name: steps-in-order
    type: llm
    weight: 2
    criteria: >-
      It walks through the failover in order: page from the primary-down alert, check replication lag, stop and call the
      database lead if lag is over 30 seconds, promote with dbctl promote replica-1, switch DATABASE_URL and restart the API,
      post in #incidents and open a ticket to rebuild the old primary.
  - name: why-cited
    type: llm
    weight: 2
    criteria: >-
      It explains the 30-second lag rule with its reason (a promotion with 4 minutes of lag lost about 4 minutes of orders on
      2 March 2026; the database lead can recover the WAL) and cites incidents/2026-03-02-chat.md.
  - name: unknowns
    type: llm
    weight: 1
    criteria: >-
      For steps with no recorded reason (for example why replica-1, or why restart the API), it either says no reason was found
      or clearly marks its explanation as a guess or inference; it does not state an invented reason as fact.
